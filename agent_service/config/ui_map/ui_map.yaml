- id: glossary.rul
  type: glossary
  title: Remaining Useful Life (RUL)
  workspace: platform
  summary: Predictive forecast estimating remaining operational days before downhole equipment failure.
  description: Remaining Useful Life (RUL), expressed in days, is a prognostic modeling metric that estimates the remaining
    operational lifetime of an active downhole ESP assembly before mechanical or electrical failure necessitates a workover
    pull. The platform's machine learning models project RUL by analyzing cumulative thermal exposure, vibration stress cycles,
    motor insulation resistance trends, and historical failure distributions of matching equipment classes. Surveillance engineers
    use RUL estimates in the Reliability workspace to schedule planned intervention workovers, stage replacement inventory,
    and minimize catastrophic downhole failures. Accurately forecasting RUL enables asset managers to transition from reactive
    firefighting to proactive, scheduled well maintenance campaigns. Surveillance models recompute RUL estimates daily as
    operating hours and stress cycles accumulate across the well fleet.
