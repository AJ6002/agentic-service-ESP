- id: component.pressure-profile
  type: component
  title: Wellbore Pressure Gradient Profile
  workspace: single-well
  summary: Interactive depth-versus-pressure gradient chart visualizing fluid hydrostatic columns, drawdown, pump head boost,
    and wellhead backpressure.
  description: The Wellbore Pressure Gradient Profile renders a continuous pressure distribution curve plotted against true
    vertical depth, tracking pressure progression from the reservoir drainage radius to the surface production manifold. Starting
    at static reservoir pressure and bottom-hole flowing pressure (Pwf), the profile traces fluid drawdown across the perforation
    face into the pump intake, where intake pressure (PIP) marks the lowest pressure point in the hydraulic circuit. Across
    the multistage centrifugal pump depth interval, the curve exhibits a sharp rightward pressure jump representing total
    dynamic head boost generated by the pump stages, culminating in pump discharge pressure (PDP). From the discharge depth
    to the surface wellhead, the chart plots the fluid column gradient through the production tubing, accounting for multiphase
