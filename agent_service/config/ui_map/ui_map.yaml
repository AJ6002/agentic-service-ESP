- id: glossary.hz
  type: glossary
  title: Hertz (Hz)
  workspace: platform
  summary: Standard unit of alternating electrical frequency measuring cycles per second.
  description: Hertz (Hz) is the international unit of electrical frequency, defining the number of sinusoidal cycles per
    second of alternating voltage and current delivered by the surface variable speed drive. Frequency is the primary control
    setpoint utilized by production operators to manage ESP rotational speed, liquid flow rate, and total developed dynamic
    head. In the platform, frequency is continuously displayed in real time across the Cockpit, Live Calculations, and Single-Well
    monitor, serving as the baseline parameter for all affinity law scaling calculations. Operating teams adjust frequency
    in precise decimal increments to keep the pump within its Best Efficiency Point envelope while adapting to changing reservoir
    productivity and water cut conditions.
