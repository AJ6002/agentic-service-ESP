- id: glossary.rpm
  type: glossary
  title: Revolutions Per Minute (RPM)
  workspace: platform
  summary: Rotational speed of the downhole motor and pump shaft assembly.
  description: Revolutions Per Minute (RPM) measures the rotational speed of the downhole induction motor rotor and centrifugal
    pump shaft assembly. For a standard 2-pole downhole induction motor operating at 60 Hz line frequency, synchronous rotational
    speed is 3,600 RPM (or 3,000 RPM at 50 Hz), with actual full-load mechanical speed operating slightly lower (typically
    3,450 to 3,500 RPM) due to rotor slip. As the surface VSD modulates drive frequency, shaft RPM changes proportionally,
    scaling centrifugal pump throughput and head in accordance with affinity laws. Tracking rotational speed enables surveillance
    systems to calculate mechanical slip, verify motor torque delivery, and detect abnormal shaft binding or bearing drag.
  related:
