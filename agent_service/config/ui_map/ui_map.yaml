- id: concept.hazen-williams
  type: concept
  title: Hazen-Williams Hydraulic Friction Loss
  workspace: engineering
  summary: Empirical hydraulic formula modeling piping frictional pressure drop as a function of liquid throughput, tubing
    diameter, and roughness.
  description: The Hazen-Williams Hydraulic Friction equation is an empirical formulation utilized in petroleum and pipeline
    engineering to calculate frictional head loss resulting from liquid flow through circular production tubing. In the ESP
    Insights platform, the engine computes friction head loss (h_friction in feet) using the standard equation h = (10.67
    * L * Q^1.852) / (C^1.852 * d^4.8655), where L represents tubing measured length in feet, Q is liquid flow rate in gallons
    per minute, d is tubing internal diameter in inches, and C is the Hazen-Williams pipe roughness coefficient (nominally
    120.0 for steel production tubing). Frictional head loss constitutes a key additive component of Total Dynamic Head (TDH),
    scaling exponentially with fluid production velocity. Petroleum engineers inspect Hazen-Williams calculations within the
    Engineering Workbench TDH Waterfall to identify excessive friction choking in undersized tubing strings, evaluate tubing
    replacement options, and ensure accurate sizing of replacement downhole pump assemblies.
