- id: glossary.gor
  type: glossary
  title: Gas-Oil Ratio (GOR)
  workspace: platform
  summary: Volumetric ratio of produced gas volume to produced crude oil volume at standard conditions.
  description: The Gas-Oil Ratio (GOR), expressed in standard cubic feet of gas per stock tank barrel of oil (scf/bbl), quantifies
    the relative proportion of hydrocarbon gas produced alongside crude oil at standard surface conditions. GOR is a crucial
    reservoir and production parameter that dictates downhole multiphase flow regimes. Wells exhibiting elevated GOR frequently
    experience high Gas Volume Fractions (GVF) at downhole pump intake conditions, predisposing the centrifugal pump to gas
    interference, head degradation, or catastrophic gas lock. The platform incorporates GOR in Virtual Flow Metering and What-If
    simulations to model downhole gas breakout and guide surface venting operations. Production teams track GOR shifts to
    detect reservoir gas cap expansion or localized secondary gas coning.
