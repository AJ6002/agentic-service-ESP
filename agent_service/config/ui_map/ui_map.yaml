    the pump operates with sufficient Net Positive Suction Head (NPSH) and keeps downhole pressure above the fluid bubble
    point to prevent volatile solution gas from breaking out into free gas bubbles that cause gas locking. Depleted PIP signals
    aggressive reservoir drawdown, declining reservoir pressure, or wellbore skin buildup. The platform displays PIP across
    all operational screens, utilizing it to calculate dynamic vertical lift in the TDH Waterfall, evaluate inflow performance
    relationships (IPR), and trigger automated underload pump-off alarms.
