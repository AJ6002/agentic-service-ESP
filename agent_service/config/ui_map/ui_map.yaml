- id: glossary.pip
  type: glossary
  title: Pump Intake Pressure (PIP)
  workspace: platform
  summary: Hydrostatic fluid pressure measured at the downhole pump suction intake ports.
  description: Pump Intake Pressure (PIP), measured in pounds per square inch gauge (psig), represents the absolute suction
    fluid pressure available at the entrance to the electric submersible pump intake ports downhole. PIP is the foundational
    operational indicator of reservoir pressure depletion, wellbore drawdown, and fluid inflow performance. Maintaining sufficient
    PIP is essential for ensuring adequate Net Positive Suction Head (NPSH) to prevent impeller cavitation and keeping downhole
    pressure safely above the fluid bubble point to avoid free gas breakout. Within the platform, PIP is streamed via real-time
    SCADA telemetry, displayed across triage queues, and utilized as a vital input in Total Dynamic Head (TDH) calculations,
    wellbore pressure gradient profiles, and automated underload pump-off protection alarms. Surveillance engineers continuously
    correlate PIP with motor current to diagnose whether fluid starvation stems from true reservoir depletion or physical
    intake screen plugging.
  related:
  - channel.intake_pressure_psi
  - concept.tdh
  aliases:
  - pip
  - pump intake pressure
  - intake pressure
- id: glossary.pdp
  type: glossary
  title: Pump Discharge Pressure (PDP)
  workspace: platform
  summary: Hydraulic fluid pressure measured at the discharge head of the electric submersible pump.
  description: Pump Discharge Pressure (PDP), measured in pounds per square inch gauge (psig), is the hydraulic fluid pressure
    developed at the discharge head of the downhole multistage centrifugal pump immediately below the production tubing string.
    PDP represents the cumulative mechanical energy imparted to produced fluids by the series of spinning impellers to overcome
    vertical elevation lift, tubing wall friction, and surface wellhead backpressure. The platform monitors PDP in real time
    to calculate differential pressure boost across pump stages, evaluate stage hydraulic wear against catalog H-Q curves,
    and feed Virtual Flow Metering production allocation models. Comparing PDP against theoretical pump curves allows surveillance
    engineers to rapidly distinguish between internal pump stage degradation, tubing check valve leaks, and downstream flowline
    restrictions.
  related:
  - channel.discharge_pressure_psi
  - concept.differential-pressure
  aliases:
  - pdp
  - pump discharge pressure
  - discharge pressure
- id: glossary.whp
  type: glossary
  title: Wellhead Flowing Pressure (WHP)
  workspace: platform
  summary: Surface pressure measured at the wellhead Christmas tree upstream of the production choke.
  description: Wellhead Flowing Pressure (WHP), measured in pounds per square inch gauge (psig), represents the surface fluid
    pressure exerted at the production Christmas tree upstream of the surface adjustable choke manifold. WHP serves as the
    final surface hydraulic boundary condition in the artificial lift circuit, reflecting the backpressure that the downhole
    pump must overcome to deliver fluids into gathering pipelines. In the platform, WHP is continuously logged from surface
    SCADA transmitters, converted into equivalent liquid feet for Total Dynamic Head calculations, and utilized in What-If
    simulations to model the hydraulic impact of downstream flowline restrictions, gathering line pressure fluctuations, and
    surface separator adjustments. Operators monitor WHP during choke adjustments to maintain stable well deliverability without
    forcing the downhole pump into hazardous upthrust or downthrust regions.
  related:
  - channel.wellhead_pressure_psi
  - concept.tdh
  aliases:
  - whp
  - wellhead pressure
  - tubing head pressure
- id: glossary.flp
  type: glossary
  title: Flowline Pressure (FLP)
  workspace: platform
  summary: Surface fluid pressure in the gathering flowline downstream of the wellhead choke valve.
  description: Flowline Pressure (FLP), measured in pounds per square inch gauge (psig), represents the fluid transport pressure
    in the surface gathering pipeline downstream of the wellhead production choke valve, leading toward the field gathering
    center station manifold. FLP establishes the minimum surface backpressure against which the well must deliver produced
    fluids into the gathering system. Surveillance engineers track FLP within the platform to evaluate gathering network hydraulic
    capacity, detect pipeline wax, scale, or hydrate blockages, and ensure that the surface production choke maintains an
    appropriate pressure drop for stable fluid control. Significant variations in FLP directly affect wellhead flowing pressure
    and shift the downhole operating point along the pump performance curve.
  related:
