- id: concept.affinity-laws
  type: concept
  title: Centrifugal Pump Affinity Laws
  workspace: engineering
  summary: Mathematical scaling laws governing centrifugal pump capacity, dynamic head, and power requirements across variable
    operating frequencies.
  description: 'The Centrifugal Pump Affinity Laws represent the mathematical principles governing the dynamic performance
    scaling of multistage centrifugal pumps when operating rotational speed varies. Because the downhole motor speed is directly
    modulated by surface variable speed drive (VFD) frequency, affinity laws define how pump performance curves shift: volumetric
    liquid flow rate (Q) scales proportionally with speed (Q1/Q2 = N1/N2), developed total dynamic head (H) scales with the
    square of speed (H1/H2 = (N1/N2)^2), and brake horsepower (BHP) scales with the cube of speed (P1/P2 = (N1/N2)^3). In
    the platform, these laws dynamically project catalog 50 Hz and 60 Hz pump performance curves to the active operating frequency
    (e.g., 45 Hz or 55 Hz) in the Live Pump Curve widget and What-If Simulation Studio. Engineers utilize affinity scaling
    to evaluate the production upside and electrical power impact of frequency adjustments before implementing speed changes
    in the field.'
