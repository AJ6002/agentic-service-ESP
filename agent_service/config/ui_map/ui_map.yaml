- id: concept.bep
  type: concept
  title: Best Efficiency Point (BEP)
  workspace: engineering
  summary: Optimal operating design point on a centrifugal pump curve where hydraulic conversion efficiency reaches its absolute
    maximum.
  description: The Best Efficiency Point (BEP) represents the unique volumetric flow rate and head coordinate on a centrifugal
    pump performance curve where the pump operates at its maximum hydraulic efficiency. At BEP, fluid enters the impeller
    vanes and diffuser channels with minimal incidence angle shock, minimal internal fluid recirculation, and minimal hydraulic
    turbulence. Consequently, internal mechanical thrust forces acting on the pump rotor assemblies reach equilibrium, resulting
    in minimized radial vibration and optimal bearing longevity. The manufacturer defines a Recommended Operating Range (ROR)
    around the BEP (typically 70% to 125% of BEP flow rate). Operating outside the ROR induces destructive downthrust (at
    low flow rates) or upthrust (at excessive flow rates), accelerating mechanical wear and triggering hydraulic instability.
    The platform highlights BEP and ROR corridors across all pump curve visualizations, empowering surveillance engineers
    to keep operating points centered within safe, energy-efficient hydrodynamic zones.
