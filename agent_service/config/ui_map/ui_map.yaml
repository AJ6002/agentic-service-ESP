- id: concept.gvf
  type: concept
  title: Gas Volume Fraction (GVF)
  workspace: operations
  summary: Volumetric ratio of free gas to total fluid mixture at pump intake conditions governing multiphase hydraulic degradation.
  description: Gas Volume Fraction (GVF) represents the volumetric percentage of free, undissolved gas relative to the total
    multiphase fluid volume (free gas plus liquid oil and water) evaluated at downhole pump intake pressure and temperature
    conditions. Expressed as GVF = V_gas / (V_gas + V_liquid), GVF is the governing criterion for downhole pump selection
    and multiphase performance stability. When GVF remains below 10% to 15%, standard centrifugal pump stages operate with
    minimal hydraulic degradation. When GVF surpasses 20%, compressible gas bubbles expand inside impeller passages, causing
    head derating, fluid cavitation, and motor current hunting. Above 35% GVF, standard pumps experience severe gas interference
    and imminent gas locking, requiring specialized downhole gas handlers or vortex gas separators to vent gas into the casing
    annulus. The platform computes live in-situ GVF across all active wells, displaying it in Live Calculations and What-If
    simulations to guide gas mitigation strategies.
