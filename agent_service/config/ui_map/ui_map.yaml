- id: glossary.ipr
  type: glossary
  title: Inflow Performance Relationship (IPR)
  workspace: platform
  summary: Mathematical curve describing well production rate as a function of flowing bottomhole pressure.
  description: The Inflow Performance Relationship (IPR) is a fundamental reservoir engineering curve that defines the mathematical
    relationship between wellbore liquid production rate and flowing bottomhole pressure (Pwf). Based on Darcy's Law or Vogel's
    multiphase inflow equation, the IPR curve quantifies reservoir deliverability, predicting the maximum open-flow potential
    (AOF) when Pwf equals zero. The platform reconciles IPR curves with centrifugal pump performance curves in the Engineering
    Workbench to determine operating equilibrium and optimize artificial lift drawdown. Comparing historical IPR trends allows
    engineers to diagnose near-wellbore formation damage, monitor reservoir pressure depletion, and design artificial lift
    upgrades during workovers. Visualizing the intersection of the pump operating point with the formation IPR ensures that
    artificial lift drawdown does not exceed safe reservoir outflow limits.
  related:
  - concept.tdh
  - route.engineering-workbench
  aliases:
  - ipr
  - inflow performance
  - inflow relationship
  - vogel curve
- id: glossary.pi
  type: glossary
  title: Productivity Index (PI)
  workspace: platform
  summary: Reservoir deliverability metric measuring liquid flow rate per unit of pressure drawdown.
  description: Productivity Index (PI), expressed in barrels per day per pound per square inch (bpd/psi), quantifies the deliverability
    capacity of a producing hydrocarbon reservoir. Calculated as PI = Q / (P_res - Pwf), where Q is production rate, P_res
    is static reservoir pressure, and Pwf is flowing bottomhole pressure, PI measures how readily the reservoir delivers fluids
    into the wellbore per unit of pressure drawdown. The platform uses PI values to model reservoir inflow dynamics, evaluate
    well stimulation efficacy, and calibrate What-If simulations. A declining PI signals wellbore skin formation, scale precipitation,
    or localized reservoir pressure depletion requiring acidization or hydraulic fracturing remediation.
  related:
  - route.custom-testing
  - route.engineering-workbench
  aliases:
  - pi
  - productivity index
  - well productivity
- id: glossary.tdh
  type: glossary
  title: Total Dynamic Head (TDH)
  workspace: platform
  summary: Total equivalent liquid head in feet developed by the pump to overcome vertical lift, friction, and backpressure.
  description: 'Total Dynamic Head (TDH) is the total effective work in equivalent liquid feet that an electric submersible
    pump must generate to lift produced fluids from the dynamic wellbore fluid level to the surface production separator.
    TDH comprises three primary components: dynamic vertical elevation lift, tubing piping friction head loss (calculated
    via Hazen-Williams equations), and surface wellhead backpressure head. TDH is calculated dynamically across all operational
    views and visualized in the Engineering Workbench TDH Waterfall. Petroleum engineers track TDH to ensure that installed
    pump stage counts deliver sufficient hydraulic head to sustain target production rates without overloading the motor or
    operating in downthrust.'
  related:
  - concept.tdh
  - route.engineering-workbench
  aliases:
  - tdh
  - total dynamic head
  - head feet
- id: glossary.bep
  type: glossary
  title: Best Efficiency Point (BEP)
  workspace: platform
  summary: Design flow rate coordinate where centrifugal pump hydraulic efficiency reaches peak maximum.
  description: The Best Efficiency Point (BEP) is the optimal volumetric flow rate on a pump performance curve where the centrifugal
    pump operates with maximum hydraulic efficiency and minimum internal mechanical stress. Operating near BEP ensures balanced
    hydrodynamic thrust forces, minimizing wear on downhole thrust bearings and maximizing equipment run-life. The platform
    renders BEP markers and Recommended Operating Range (ROR) corridors across all pump curve charts to keep operational operating
    points safely centered. Excursions away from BEP into upthrust or downthrust accelerate bearing fatigue, induce shaft
    vibration, and reduce overall artificial lift energy efficiency. Surveillance teams continuously adjust variable speed
    drive frequencies to steer well operating points toward BEP, minimizing mechanical fatigue and optimizing electrical power
    consumption across the asset lifecycle.
  related:
  - concept.bep
  - component.live-pump-performance-curve
  aliases:
  - bep
  - best efficiency point
  - optimal point
- id: glossary.sg
  type: glossary
  title: Specific Gravity (SG)
  workspace: platform
  summary: Dimensionless ratio of produced fluid mixture density relative to pure water.
  description: Specific Gravity (SG) is the dimensionless ratio of produced fluid density compared to the density of fresh
    water at standard conditions (where water SG equals 1.00, or 0.433 psi/ft hydrostatic gradient). Composite fluid specific
    gravity is calculated as a volume-weighted blend of crude oil, formation brine, and dissolved gas. SG is an essential
    conversion factor used across the platform to translate pressure in pounds per square inch (psi) into equivalent liquid
    head in feet (Head = psi / (0.433 * SG)) for TDH and pump curve calculations. Fluctuations in SG directly alter the hydrostatic
    pressure gradient in the tubing, impacting motor power requirements and pump head performance.
  related:
  - concept.tdh
  - route.live-calculations
  aliases:
  - sg
  - specific gravity
  - fluid density ratio
- id: glossary.pvt
  type: glossary
  title: Pressure-Volume-Temperature (PVT)
  workspace: platform
  summary: Thermodynamic laboratory fluid properties governing fluid phase behavior, bubble point, and solution gas.
  description: Pressure-Volume-Temperature (PVT) analysis encompasses the thermodynamic laboratory models that describe how
    reservoir hydrocarbon fluids change phase, density, volume, and viscosity under changing pressures and temperatures. Crucial
    PVT parameters include bubble point pressure (Pb), solution gas-oil ratio (Rs), oil formation volume factor (Bo), and
    fluid viscosity. The platform's calculation services incorporate PVT correlations to model downhole gas breakout, adjust
    in-situ fluid densities, and calibrate multiphase Virtual Flow Metering algorithms. Accurate PVT characterization ensures
    that downhole pump performance curves and fluid gradient profiles reflect true thermodynamic reservoir fluid properties.
    Engineers review PVT tables and fluid property models within the platform to ensure that thermodynamic volume factor calculations
    and viscosity adjustments remain synchronized with the latest reservoir fluid sampling tests.
  related:
