- id: route.live-calculations
  type: route
  title: Live Real-Time Telemetry & Derived Physics Calculations
  path: /live-calculations
  workspace: operations
  summary: Sub-second telemetry processing hub computing Virtual Flow Metering (VFM), dynamic head, and stage-by-stage hydraulic
    diagnostics.
  description: The Live Real-Time Telemetry & Derived Physics Calculations workspace provides an intensive, high-frequency
    analytical view of electrical submersible pump operational dynamics across all active field assets. Streaming real-time
    SCADA telemetry packets every second over WebSocket connections, the engine ingests raw sensor inputs including variable
    speed drive frequency in Hertz, motor current draw in amperes, bus supply voltage, pump intake pressure (PIP), pump discharge
    pressure (PDP), wellhead flowing pressure (WHP), downhole vibration amplitude, and motor winding temperature. Downstream
    physics algorithms continuously execute multiphase Virtual Flow Metering (VFM) models, reconciling gross liquid rates
    against surface test records and computing key performance indicators such as total dynamic head (TDH), differential pressure
    across pump stages, head degradation percentage relative to catalog curves, and hydraulic power delivery. Operating engineers
    utilize this view to audit formula coefficients, inspect live sensor quality flags, analyze higher-order thermodynamic
    parameters including gas volume fraction (GVF) and fluid specific gravity corrections, and adjust baseline operating thresholds
    in real time. The page also features a dedicated Master Formulae and KPI thresholds configuration drawer, enabling authorized
    users to fine-tune production allocation models and alert boundaries without interrupting background data ingestion.
