- id: component.subsystem-equalizer
  type: component
  title: Subsystem Equalizer
  workspace: operations
  summary: Real-time 4-channel divergent stereo meter displaying operational percentage deviations across Hydraulics, Electrical,
    Thermal, and Mechanical ESP subsystems.
  description: 'The Subsystem Equalizer is a real-time diagnostic widget that isolates ESP equipment health into four distinct
    physical domains: Hydraulics (intake, discharge, and wellhead pressures), Electrical (current load, phase balance, voltage,
    and VFD frequency), Thermal (internal motor temperature and cooling flow adequacy), and Mechanical (radial vibration,
    axial vibration, and shaft torque). Each domain renders a divergent meter bar centered on zero baseline equilibrium. Deviations
    within the ±15% dashed corridor reflect nominal baseline operating conditions. The divergent bars turn amber during elevated
    warning deviations (+15% to +35%) and shift to crimson at critical hazard thresholds, such as deviations exceeding ±35%,
    motor thermal runaway beyond 135°C, or mechanical vibration surpassing 0.35 G. Hovering over any subsystem reveals underlying
    SCADA telemetry channels, baseline setpoints, and physics diagnostic tags.'
