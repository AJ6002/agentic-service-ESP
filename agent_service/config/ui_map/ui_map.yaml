- id: glossary.bhp
  type: glossary
  title: Bottomhole Pressure / Brake Horsepower (BHP)
  workspace: platform
  summary: Dual engineering term referring to Bottomhole Pressure (reservoir) or Brake Horsepower (mechanical motor work).
  description: 'BHP is a dual engineering acronym in artificial lift surveillance: in reservoir engineering, it designates
    Bottomhole Pressure (Pwf), the in-situ fluid pressure at the reservoir sandface governing well inflow; in mechanical pump
    engineering, it designates Brake Horsepower, the actual mechanical power in horsepower (hp) delivered to the pump shaft
    to lift fluid against total dynamic head. The platform resolves both contexts cleanly: flowing bottomhole pressure is
    tracked in reservoir drawdown models, while motor brake horsepower is plotted across live pump performance curves and
    engineering catalogs. Distinguishing between hydraulic power and shaft brake horsepower allows engineers to audit electrical
    motor loading, verify equipment sizing, and optimize downhole energy efficiency.'
