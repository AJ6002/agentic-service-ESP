- id: concept.water-cut
  type: concept
  title: Water Cut & Emulsion Rheology
  workspace: operations
  summary: Volumetric ratio of produced water impacting composite fluid specific gravity, hydrostatic head, and emulsion viscosity.
  description: 'Water Cut represents the volumetric fraction of produced formation water relative to total gross liquid production,
    typically expressed as a percentage. In petroleum artificial lift engineering, water cut plays a profound role in determining
    fluid physical properties: as water cut increases, the composite specific gravity of the produced liquid mixture rises
    from that of crude oil (typically 0.82 to 0.88) toward that of saline formation brine (1.02 to 1.15). This density increase
    raises the hydrostatic pressure gradient of the fluid column in the production tubing, requiring higher pump discharge
    pressure and greater motor brake horsepower to lift each barrel. Furthermore, intermediate water cut ranges (30% to 70%)
    frequently form tight water-in-oil or oil-in-water emulsions with significantly elevated apparent viscosity, multiplying
    piping friction losses. The platform accounts for water cut in all hydraulic head, Hazen-Williams friction, and Virtual
    Flow Metering models to ensure accurate production surveillance.'
