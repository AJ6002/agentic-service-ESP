- id: concept.differential-pressure
  type: concept
  title: Pump Differential Pressure (Delta P)
  workspace: operations
  summary: Net hydraulic pressure boost generated across the ESP assembly calculated as discharge pressure minus intake pressure.
  description: 'Pump Differential Pressure (Delta P), measured in pounds per square inch (psi), represents the net hydraulic
    pressure boost generated across the stages of the electric submersible pump assembly. Calculated directly as the difference
    between pump discharge pressure and pump intake pressure (Delta P = PDP - PIP), differential pressure is the primary empirical
    measure of the mechanical work delivered by the pump to the wellbore fluid. When converted into equivalent liquid feet
    using fluid specific gravity, Delta P directly reflects the total dynamic head developed by the pump stages under active
    operating frequency and fluid viscosity conditions. Monitoring differential pressure trends allows surveillance engineers
    to rapidly identify downhole abnormalities: an abrupt drop in Delta P indicates pump stage erosion, mechanical disconnection,
    or fluid gasification, whereas a gradual decline signals progressive pump wear. The platform visualizes Delta P across
    the Live Calculations hub, Single-Well monitor, and ML diagnostics.'
