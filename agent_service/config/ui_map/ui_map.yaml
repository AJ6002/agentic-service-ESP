    by the pump stages. Comparing PDP against theoretical catalog performance curves allows surveillance engineers to diagnose
    internal pump stage wear, impeller erosion, or scale accumulation inside the pump housing. A sudden drop in PDP while
    motor current remains normal indicates severe pump stage degradation or fluid recirculation, whereas an abnormal surge
    in PDP suggests downstream tubing restrictions, closed surface choke valves, or wax deposition in the production string.
