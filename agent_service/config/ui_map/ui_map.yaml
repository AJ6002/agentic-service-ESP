- id: glossary.wc
  type: glossary
  title: Water Cut (WC)
  workspace: platform
  summary: Volumetric percentage of produced formation water relative to total gross liquid volume.
  description: Water Cut (WC), expressed as a percentage (%), measures the fraction of produced formation water contained
    within the total liquid stream lifted by the pump. As water cut increases, the composite fluid density rises toward that
    of formation brine, increasing the hydrostatic column weight in the production tubing and elevating required motor power.
    Within the platform, water cut is updated from physical laboratory test records and utilized in real-time calculations
    to calibrate fluid specific gravity, Hazen-Williams friction factors, and multiphase Virtual Flow Metering models. Monitoring
    water cut trends is vital for diagnosing reservoir water coning, planning chemical demulsifier injection, and predicting
    when elevated fluid hydrostatic head will exceed available pump stage head capacity.
