- id: glossary.mtbf
  type: glossary
  title: Mean Time Between Failures (MTBF)
  workspace: platform
  summary: Core equipment reliability metric measuring the average operating run days before pull and failure.
  description: Mean Time Between Failures (MTBF), expressed in operating days, is a primary reliability key performance indicator
    measuring the average duration of continuous operation achieved by electric submersible pump systems between unscheduled
    equipment failures. The platform computes MTBF dynamically from historical run-life logs and workover teardown records,
    segmenting statistics across gathering centers, pump manufacturers, and equipment series. Surveillance teams track MTBF
    trends in the Reliability workspace to benchmark equipment longevity, evaluate supplier manufacturing quality, and optimize
    preventative maintenance strategies. Improving fleet-wide MTBF reduces costly rig intervention workovers, minimizes deferred
    oil production, and optimizes capital expenditure on replacement downhole strings. Tracking MTBF across run-life cohorts
    allows artificial lift engineers to justify premium metallurgy investments and evaluate root causes during workovers.
