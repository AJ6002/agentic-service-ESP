- id: glossary.esp
  type: glossary
  title: Electric Submersible Pump (ESP)
  workspace: platform
  summary: High-volume downhole artificial lift assembly comprising a multistage pump, seal, and motor.
  description: An Electric Submersible Pump (ESP) is an artificial lift system designed to lift moderate-to-high volumes of
    fluids from oil and water wells across the asset portfolio. Suspended on production tubing deep within the wellbore, the
    ESP assembly consists of a downhole three-phase electric induction motor, a protector seal section for pressure equalization
    and fluid exclusion, an intake or rotary gas separator, and a multistage centrifugal pump. The ESP platform provides end-to-end
    digital twin surveillance, deterministic physics calculations, and predictive machine learning diagnostics across the
    complete operating lifecycle of ESP assets. Operating engineers rely on real-time ESP telemetry to balance reservoir drawdown,
    maximize production throughput, and extend downhole run-life across varying field operating conditions.
  related:
