- id: glossary.vsd
  type: glossary
  title: Variable Speed Drive (VSD)
  workspace: platform
  summary: Surface solid-state power electronics controller regulating motor frequency and speed.
  description: A Variable Speed Drive (VSD), also designated as a Variable Frequency Drive (VFD), is the surface solid-state
    power electronics controller that regulates electrical alternating frequency and voltage delivered to the downhole electric
    submersible motor. By adjusting output frequency (typically between 35 Hz and 65 Hz), the VSD allows operators to modulate
    pump rotational speed, fluid throughput, and developed head in accordance with centrifugal affinity laws. The platform
    interfaces directly with VSD controllers via industrial gateways to stream operational telemetry, track run hours, analyze
    harmonic distortion, and issue diagnostic setpoint advisories. Surveillance teams leverage VSD agility to optimize well
    productivity dynamically, manage soft-start acceleration ramps, and mitigate mechanical stress during restarts.
