- id: glossary.ap
  type: glossary
  title: Annulus Pressure (AP)
  workspace: platform
  summary: Gas or fluid pressure trapped within the annular casing-tubing space above the downhole pump.
  description: Annulus Pressure (AP), measured in pounds per square inch gauge (psig), represents the pressure of gas or fluid
    accumulating in the annular space between the production casing and the tubing string uphole of the downhole pump. In
    wells producing volatile hydrocarbons with high gas-oil ratios, solution gas naturally migrates into the annulus; if unvented,
    elevated annulus pressure depresses the annular fluid level and impairs pump intake performance. The platform monitors
    AP across operations dashboards to optimize casing-head gas venting valves and ensure wellbore barrier integrity. Tracking
    annulus pressure trends alongside acoustic fluid level shots enables production engineers to optimize casing gas collection,
    reduce downhole gas interference, and protect surface casing valves against overpressure conditions.
