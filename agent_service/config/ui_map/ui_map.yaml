- id: glossary.gvf
  type: glossary
  title: Gas Volume Fraction (GVF)
  workspace: platform
  summary: Percentage volumetric fraction of free gas relative to total fluid volume at pump intake.
  description: Gas Volume Fraction (GVF), expressed as a percentage (%), measures the volumetric ratio of free, undissolved
    hydrocarbon gas to total multiphase fluid volume evaluated at downhole pump intake pressure and temperature conditions.
    High GVF causes fluid compressibility inside centrifugal impellers, resulting in severe head degradation, motor load cycling,
    and potential gas locking. The platform tracks GVF continuously across live surveillance and simulation studios to guide
    downhole gas separator selection and surface casing-head venting operations. When in-situ GVF exceeds 15%, operators deploy
    specialized multiphase gas handling pump stages or adjust VFD speed to prevent gas bubble aggregation from destabilizing
    downhole pump hydraulics.
