    than intake pressure during active production, or motor temperature reporting freezing values while current remains high.
    The platform's integrity algorithms identify sensor drift by cross-validating telemetry against adjacent sensors, physics-based
    Virtual Flow Metering models, and mass balance conservation laws, flagging bad sensor data quality flags and isolating
