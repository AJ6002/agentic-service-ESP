- id: channel.power_factor
  type: concept
  title: Electrical Power Factor
  workspace: operations
  summary: Dimensionless ratio of real electrical power to apparent power indicating motor inductive load efficiency and power
    transmission quality.
  description: Electrical Power Factor is a dimensionless ratio ranging from 0.0 to 1.0 that quantifies the phase relationship
    between alternating voltage and current waveforms in the electrical submersible pump circuit. Defined as the cosine of
    the phase angle between voltage and current, power factor reflects the proportion of electrical energy converted into
    useful mechanical shaft work (real power in kilowatts) versus energy stored in magnetic fields (reactive power in kVAR).
    Well-loaded induction motors typically achieve power factors between 0.82 and 0.89 under nominal production conditions.
    A significant decline in power factor toward 0.60 or lower signals severe motor underload, occurring during gas locking,
    dry-well pump-off, or broken shaft events where the motor operates with minimal mechanical resistance. The platform utilizes
    power factor telemetry in the Subsystem Equalizer and What-If simulator to detect uncoupling between electrical energy
    input and hydrodynamic fluid delivery, alerting operators to inefficient energy utilization and potential downhole mechanical
    disconnection.
