- id: concept.tdh
  type: concept
  title: Total Dynamic Head (TDH)
  workspace: platform
  summary: Total equivalent vertical head in feet that the ESP must generate to lift reservoir fluids to the surface against
    friction and wellhead backpressure.
  description: 'Total Dynamic Head (TDH) measures the total effective work in equivalent liquid feet that an electric submersible
    pump must generate to lift reservoir fluids to the surface separator at a given production rate. TDH comprises three primary
    hydraulic components: dynamic vertical lift from the producing fluid level to the surface wellhead, frictional piping
    losses calculated via Hazen-Williams or Darcy-Weisbach flow regimes through production tubing, and surface wellhead backpressure
    converted from PSI into equivalent liquid feet using fluid specific gravity (at 0.433 psi/ft multiplied by SG). Within
    the platform, TDH is computed dynamically from real-time SCADA telemetry, reconciled against pump catalog performance
    curves to locate Best Efficiency Point (BEP) head, visualized within the Engineering Workbench TDH Waterfall, and utilized
    to calculate hydraulic power and brake horsepower.'
  related:
  - component.subsystem-equalizer
  - route.working-status
  aliases:
  - TDH
  - total dynamic head
  - dynamic head
  - pump head
  - total head
  - head feet
