    in degrees Celsius (°C), transmitted by the downhole digital sensor gauge via the motor power cable. Motor temperature
    is governed by the equilibrium between internal resistive I2R and eddy current heat generation versus thermal cooling
    provided by fluid passing uphole past the motor housing exterior. Sustained fluid velocity of at least 1.0 ft/sec across
    the motor skin is required for adequate cooling. When intake fluid drops below this threshold—or during severe electrical
    overloading, scale deposition on the motor jacket, or pump-off conditions—motor temperature escalates rapidly. Exceeding
    manufacturer thermal limits (typically 120°C to 145°C depending on insulation class) accelerates dielectric breakdown
    of motor winding varnish and lead wire insulation, drastically shortening equipment run-life. In the platform, motor temperature
    is tracked with critical threshold alerts, visualized in the Subsystem Equalizer, and evaluated in ML thermal overload
    fault models.
