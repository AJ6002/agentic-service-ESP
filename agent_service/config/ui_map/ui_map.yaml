  - route.live-calculations
  aliases:
  - pvt
  - pressure volume temperature
  - fluid pvt
- id: glossary.mle
  type: glossary
  title: Motor Lead Extension (MLE)
  workspace: platform
  summary: Specialized low-profile armored electrical flat cable connecting the main power cable to the motor pothead.
  description: The Motor Lead Extension (MLE), commonly referred to as the flat cable, is a specialized, low-profile armored
    electrical cable designed to fit within the narrow annular clearance between the ESP pump housing and the well casing
    string. The MLE connects the main round three-phase power cable to the motor pothead terminal at the bottom of the assembly.
    Because the MLE operates in the hottest and most mechanically constrained section of the wellbore, it is historically
    a frequent source of electrical insulation breakdown. The platform tracks MLE specifications in the Equipment Configuration
    console, auditing cable thermal ratings and conductor sizing to prevent downhole electrical ground faults.
  related:
  - route.esp-configuration
  - fault.phase-imbalance
  aliases:
  - mle
  - motor lead extension
  - flat cable
  - pothead cable
- id: glossary.tr
  type: glossary
  title: Transformer / Turns Ratio (TR)
  workspace: platform
  summary: Surface electrical step-up transformer converting VSD output voltage to downhole transmission levels.
  description: Transformer Ratio (TR) refers to the voltage step-up transformation ratio of the surface three-phase electrical
    transformer installed between the variable speed drive and the downhole power cable. To minimize resistive I2R electrical
    power losses along thousands of feet of downhole cable, surface transformers step up the VSD output voltage (e.g., 480
    V) to downhole transmission levels (e.g., 2,000 V to 4,000 V). The platform logs transformer tap settings and transformation
    ratios in the Administration and Configuration consoles to verify electrical voltage balancing. Proper TR selection guarantees
    that rated voltage arrives at the downhole motor terminals without causing transformer saturation or excessive cable voltage
    drop.
  related:
  - channel.motor_voltage_v
  - route.administration
  aliases:
  - tr
  - transformer
  - transformer ratio
  - step-up transformer
- id: glossary.ot
  type: glossary
  title: Operational Technology (OT)
  workspace: platform
  summary: Industrial hardware and software systems monitoring and controlling physical field equipment.
  description: Operational Technology (OT) designates the category of industrial hardware, programmable logic controllers
    (PLCs), remote terminal units (RTUs), and SCADA telecommunication networks that directly monitor and control physical
    oilfield equipment. In the platform architecture, OT systems interface with the IT application layer via the OTConnex
    Industrial Gateway, transmitting high-frequency sensor telemetry, variable speed drive registers, and electrical trip
    codes into the PostgreSQL historian and web application. The platform maintains strict data integrity boundaries between
    OT telemetry ingestion and web client visualization to ensure enterprise cybersecurity and uninterrupted real-time surveillance.
    Ensuring high-speed OT telemetry streaming with low latency allows surveillance engineers to execute sub-second alarm
    triage, review automated trip events, and verify setpoint updates delivered to field motor controllers.
  related:
  - route.administration
  - glossary.scada
  aliases:
  - ot
  - operational technology
  - industrial ot
- id: glossary.scada
  type: glossary
  title: Supervisory Control and Data Acquisition (SCADA)
  workspace: platform
  summary: Enterprise industrial automation architecture collecting real-time field telemetry and managing remote controls.
  description: Supervisory Control and Data Acquisition (SCADA) is the enterprise industrial automation and telemetry architecture
    that collects real-time measurement signals from oilfield sensors and transmits them across radio, cellular, or fiber
    networks to central control centers. The ESP Insights platform ingests continuous SCADA data streams—including pressures,
    temperatures, currents, and frequencies—processing incoming packets through event detection engines, physics algorithms,
    and machine learning models to provide real-time surveillance. SCADA telemetry streams are synchronized with digital twin
    models to detect operational anomalies, trigger automated alarms, and display real-time equipment status across fleet
    dashboards. The platform's SCADA interface supports automated quality check rules and sensor heartbeat monitoring, ensuring
    that surveillance dashboards remain fully operational even when remote communication links experience transient field
    dropouts.
  related:
  - route.administration
  - glossary.ot
  aliases:
  - scada
  - supervisory control
  - telemetry system
- id: glossary.ml
  type: glossary
  title: Machine Learning (ML)
  workspace: platform
  summary: Statistical algorithms and neural classifiers performing automated anomaly detection and fault classification.
  description: Machine Learning (ML) encompasses the statistical algorithms, feature engineering pipelines, and classification
    models embedded within the platform's diagnostic engine. In the ESP Insights system, ML models continuously evaluate multi-channel
    sensor telemetry streams to detect operational anomalies, calculate health scores, and infer fault probabilities across
    14 canonical failure modes (such as Gas Interference, Bearing Degradation, and Intake Drawdown). The ML Studio workspace
    provides data scientists with exploratory data tools to audit and train these models. Integrating ML predictions with
    physics-based models provides surveillance engineers with explainable, high-confidence root-cause diagnostics. Surveillance
    operators leverage these automated machine learning insights to accelerate alarm triage, differentiate downhole mechanical
    failures from surface electrical grid disturbances, and prioritize engineering workover interventions across the fleet.
  related:
  - route.ml-studio
  - component.ml-fault-spectrum
  aliases:
  - ml
  - machine learning
  - ai model
  - anomaly detection
- id: glossary.rca
  type: glossary
  title: Root Cause Analysis (RCA)
  workspace: platform
  summary: Structured engineering investigation protocol determining the fundamental physical root cause of equipment failure.
  description: Root Cause Analysis (RCA) is a structured petroleum engineering investigation methodology applied following
    downhole equipment trips or premature failures to identify the fundamental root mechanism responsible for the event. The
    platform facilitates RCA workflows within the Event Intelligence and Reliability workspaces by aggregating pre-trip sensor
    histories, variable speed drive fault codes, downhole operating hours, and teardown DIFA findings, assisting engineering
    teams in preventing recurrence through improved operating practices or equipment metallurgy. Standardized RCA documentation
    ensures cross-functional learning and drives continuous equipment reliability improvement across the asset portfolio.
    By establishing standardized, auditable root-cause documentation across the asset lifecycle, the platform assists artificial
    lift teams in identifying repetitive equipment failure patterns and executing targeted engineering design improvements.
  related:
  - route.events
  - route.reliability
  aliases:
  - rca
  - root cause analysis
  - failure analysis
- id: glossary.kpi
  type: glossary
  title: Key Performance Indicator (KPI)
  workspace: platform
  summary: Quantifiable operational metric tracking asset performance, production quotas, and equipment uptime.
  description: A Key Performance Indicator (KPI) is a high-level operational metric utilized across the platform to evaluate
    asset performance, equipment health, and production efficiency against established business targets. Primary platform
    KPIs include Total Gross Liquid Production, Active Operating Well Count, Fleet Power Consumption (kW), Asset Availability
    (%), Mean Time Between Failures (MTBF), and Deferred Production Rate. KPIs are synthesized in real time and displayed
    across top-line ribbons on the Cockpit and Working Status dashboards. Production leadership and surveillance teams use
    these KPIs during daily operational reviews to track quota attainment and prioritize engineering interventions. Continuous
    KPI surveillance provides management with comprehensive visibility into asset health, downtime root causes, and operational
    efficiency across all producing gathering centers.
  related:
  - component.kpi-ribbon
  - route.cockpit
  aliases:
  - kpi
  - key performance indicator
  - performance metric
- id: glossary.vfm
  type: glossary
  title: Virtual Flow Metering (VFM)
  workspace: platform
  summary: Computational algorithm estimating liquid throughput from pump head, motor power, and frequency.
  description: Virtual Flow Metering (VFM) is a computational technique that calculates real-time well fluid production rates
    from active telemetry without relying on physical test separators. By combining downhole differential pressure measurements,
    variable speed drive operating frequency, motor electrical power consumption, and centrifugal pump performance curves,
    the VFM engine estimates gross liquid throughput in barrels per day. The platform incorporates VFM across the Cockpit,
    Live Calculations, and Single-Well views to provide continuous production allocation. VFM enables operators to detect
    sudden well deliverability drops and optimize artificial lift settings without waiting for monthly physical separator
    testing. Real-time VFM tracking allows surveillance engineers to detect sudden well productivity impairments, evaluate
    choke adjustments, and reconcile field-wide production allocation without waiting for periodic physical well separator
    test campaigns.
  related:
  - concept.vfm
  - channel.flow_rate_bpd
  aliases:
  - vfm
  - virtual flow metering
  - virtual rate
- id: glossary.nnl
  type: glossary
  title: Net Oil Production Rate (NNL)
  workspace: platform
  summary: Calculated hydrocarbon oil production rate after subtracting produced water cut from gross liquid throughput.
  description: Net Oil Production Rate (NNL), expressed in barrels of oil per day (BOPD), represents the actual hydrocarbon
    crude oil production volume after deducting produced formation water cut from gross liquid production. Calculated as Net
    Oil = Gross Liquid * (1 - (Water Cut / 100)), NNL is the definitive commercial revenue metric for asset operations. The
    platform displays net oil rates across fleet production ribbons, well test records, and operational reports, allowing
    operators to track commercial production quota attainment. Tracking NNL allows surveillance engineers to optimize artificial
    lift frequency setpoints for maximum hydrocarbon recovery while managing water production constraints. Production technologists
    track NNL trends to ensure that well intervention workovers and frequency setpoints maximize commercial oil production
    while preventing excessive water breakthrough.
  related:
  - channel.flow_rate_bpd
  - channel.water_cut_pct
  - component.kpi-ribbon
  aliases:
  - nnl
  - net oil
  - bopd
  - net rate
- id: glossary.nvl
  type: glossary
  title: Net Water Production Rate (NVL)
  workspace: platform
  summary: Calculated formation water production volume requiring surface separation, treatment, and disposal.
  description: Net Water Production Rate (NVL), expressed in barrels of water per day (BWPD), represents the volumetric rate
    of formation brine produced alongside hydrocarbon crude oil. Calculated as Net Water = Gross Liquid * (Water Cut / 100),
    NVL represents the water handling load imposed on surface gathering centers, separation vessels, water treatment facilities,
    and disposal injection wells. Monitoring NVL in the platform enables production engineers to forecast water disposal requirements,
    detect early water breakthrough, and manage facility handling constraints. Preventing excessive water production reduces
    electrical lift costs and protects surface piping against accelerated corrosion. Surveillance teams continuously monitor
    NVL to optimize downhole water shutoff treatments, balance gathering header hydraulics, and manage produced water disposal
    capacities across field injection facilities.
  related:
  - channel.flow_rate_bpd
  - channel.water_cut_pct
  aliases:
  - nvl
  - net water
  - bwpd
  - water production rate
- id: glossary.dhg
  type: glossary
  title: Downhole Gauge (DHG)
  workspace: platform
  summary: Downhole electronic sensor package measuring intake pressure, discharge pressure, motor temperature, and vibration.
  description: A Downhole Gauge (DHG) is an electronic sensor package installed directly below or within the downhole electric
    submersible motor assembly. Operating in high-temperature, high-pressure environments, the DHG continuously measures pump
    intake pressure (PIP), pump discharge pressure (PDP), internal motor winding temperature, and mechanical vibration. These
    digitized measurements are transmitted to the surface via high-frequency electronic carrier signals imposed on the main
    motor power cable. DHG telemetry provides the primary empirical foundation for all platform surveillance, Virtual Flow
    Metering calculations, and automated machine learning fault diagnostics. Engineers rely on high-precision DHG telemetry
    to evaluate downhole pump intake drawdown, verify discharge head boost across pump stages, and detect early thermal and
    mechanical degradation before catastrophic failures occur.
  related:
  - channel.intake_pressure_psi
  - channel.motor_temperature_c
  - channel.vibration_g
  aliases:
  - dhg
  - downhole gauge
  - sensor gauge
  - downhole sensor
- id: glossary.hthp
  type: glossary
  title: High Temperature High Pressure (HTHP)
  workspace: platform
  summary: Severe reservoir operating conditions characterized by extreme downhole temperatures and hydrostatic pressures.
  description: High Temperature High Pressure (HTHP) refers to extreme downhole wellbore environments typically characterized
    by bottomhole temperatures exceeding 150°C (300°F) and hydrostatic reservoir pressures exceeding 10,000 psi. Operating
    electric submersible pumps in HTHP conditions presents severe engineering challenges, including accelerated motor insulation
    thermal breakdown, rapid elastomer seal degradation, and cable sheath embrittlement. The platform incorporates specialized
    HTHP equipment ratings and derating curves in the Engineering Catalog to support surveillance in hostile wellbore conditions.
    Surveillance algorithms apply strict thermal threshold rules to prevent catastrophic dielectric breakdown in HTHP wells.
    Artificial lift engineers configure specialized high-temperature surveillance thresholds and thermal limits in the platform
    to safeguard equipment longevity and maintain operational integrity in hostile deep reservoir wells.
  related:
  - route.engineering-catalog
  - channel.motor_temperature_c
  aliases:
  - hthp
  - high temp high pressure
  - hostile environment
