    load imposed on the pump shaft by fluid lifting, mechanical friction, and fluid specific gravity. Under nominal steady-state
    conditions, current remains stable near the motor nameplate full-load amperage (FLA). An abrupt drop in motor current
    indicates underload conditions—such as dry-well pump-off, severe gas locking, or a broken drive shaft where the motor
    spins without load. Conversely, elevated current draw signals mechanical overloading caused by scale accumulation, sand
    ingestion, bearing seizure, or heavy emulsion formation. In the platform, current is monitored by automated surveillance
    rules and visualized in the Subsystem Equalizer and multi-tag trends. Tracking current fluctuations and phase balance
    is vital for protecting motor windings against thermal degradation and preventing premature downhole electrical burnouts.
