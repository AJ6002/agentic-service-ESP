- id: glossary.hp
  type: glossary
  title: Horsepower (HP)
  workspace: platform
  summary: Standard unit of mechanical or hydraulic power measurement equal to 746 Watts.
  description: Horsepower (HP) is the imperial unit of power measurement utilized across the platform to quantify the mechanical
    capacity of downhole electric motors and the hydraulic work delivered to lifted fluids. One mechanical horsepower equals
    745.7 watts or 550 foot-pounds per second. The platform records motor nameplate horsepower ratings (typically ranging
    from 50 HP to 500+ HP for commercial ESP assemblies) and calculates hydraulic horsepower (HHP = Q * TDH * SG / 135,700)
    to evaluate pump efficiency and energy conversion performance. Engineers compare operating motor horsepower demand against
    manufacturer thermal rating curves to prevent winding insulation overheating while maximizing artificial lift fluid throughput.
  related:
