    detection_method: "ML + RULE"
    ml_supported: true
    rule_supported: true
    training_examples: 6091
    event_count: 6
    affected_wells: ["FSWS-001-A", "FSWS-005", "FS-017", "FS-028", "FSWS-003", "FSWS-012"]
    required_inputs: ["intake_pressure_psi", "motor_current_a", "discharge_pressure_psi", "flow_rate_bpd"]
    severity: "CRITICAL"
    confidence_method: "CALIBRATED_CLASSIFIER_PLUS_RULE"
    validation_status: "HISTORICAL_VALIDATED"
    readiness: "READY_FOR_LIVE_VALIDATION"
    rule_definition: "Intake Pressure < 150 PSI AND Motor Current < 20 A (underload) with falling discharge pressure."
    operator_action: "Throttle production choke or pause pump to allow reservoir fluid level recovery."
    explanation_template: "Pump intake pressure collapsed below safety margin with electrical underload, indicating fluid prime loss."

  - fault_id: "BLOCKED_INTAKE"
